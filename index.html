<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebimala | Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #000; color: #fff; cursor: crosshair; overflow-x: hidden; }
    .noise {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 50; opacity: 0.05;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
    }
    .hover-invert:hover { background-color: #fff; color: #000; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;
    const GITHUB_USER = 'sebimala';
    const GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY'; // Insert your key here

    async function generateAIAnalysis(repoName, readmeText) {
      if (!GEMINI_API_KEY || GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY') {
        return "AI analysis unavailable. Please provide an API key.";
      }
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Act as a brutalist, minimalist copywriter. Write a 2-sentence technical summary for this GitHub project named ${repoName} based on this README excerpt: ${readmeText.slice(0, 1000)}` }] }]
          })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (e) {
        return "AI analysis failed to generate.";
      }
    }

    function App() {
      const [repos, setRepos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedRepo, setSelectedRepo] = useState(null);

      useEffect(() => {
        async function fetchGitHubData() {
          try {
            const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100`);
            const data = await res.json();
            
            // Filter out forks
            const nonForks = data.filter(repo => !repo.fork);
            
            // Fetch languages and descriptions concurrently
            const enhancedRepos = await Promise.all(nonForks.map(async (repo) => {
              // 1. Fetch Languages
              const langRes = await fetch(repo.languages_url);
              const langData = await langRes.json();
              const totalBytes = Object.values(langData).reduce((a, b) => a + b, 0);
              const languages = Object.entries(langData).map(([lang, bytes]) => ({
                name: lang,
                percentage: ((bytes / totalBytes) * 100).toFixed(1)
              }));

              // 2. Resolve Description
              let description = repo.description;
              let isAI = false;
              
              if (!description) {
                try {
                  const readmeRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${repo.name}/readme`);
                  if (readmeRes.ok) {
                    const readmeData = await readmeRes.json();
                    const decodedReadme = atob(readmeData.content);
                    description = await generateAIAnalysis(repo.name, decodedReadme);
                    isAI = true;
                  } else {
                    description = "No description or README available. Awaiting manual documentation.";
                  }
                } catch (e) {
                  description = "Data retrieval failed.";
                }
              }

              return { ...repo, languages, description, isAI };
            }));

            setRepos(enhancedRepos.sort((a, b) => b.stargazers_count - a.stargazers_count));
            setLoading(false);
          } catch (error) {
            console.error(error);
            setLoading(false);
          }
        }
        fetchGitHubData();
      }, []);

      if (loading) return (
        <div className="h-screen w-screen flex items-center justify-center bg-black">
          <h1 className="text-4xl md:text-8xl font-black uppercase tracking-tighter animate-pulse">Initializing System</h1>
        </div>
      );

      if (selectedRepo) return (
        <div className="min-h-screen bg-white text-black p-8 md:p-24">
          <button 
            onClick={() => setSelectedRepo(null)}
            className="mb-12 text-2xl font-black uppercase border-2 border-black px-6 py-2 hover:bg-black hover:text-white transition-colors"
          >
            ← Return
          </button>
          <h1 className="text-6xl md:text-[10vw] font-black leading-none tracking-tighter break-words mb-8">
            {selectedRepo.name}
          </h1>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-12 border-t-4 border-black pt-12">
            <div>
              <h3 className="text-2xl font-bold uppercase mb-4">Description</h3>
              <p className="text-xl md:text-3xl leading-snug font-medium mb-4">
                {selectedRepo.description}
              </p>
              {selectedRepo.isAI && (
                <span className="bg-black text-white px-3 py-1 text-sm font-bold uppercase">[AI Generated Analysis]</span>
              )}
            </div>
            <div>
              <h3 className="text-2xl font-bold uppercase mb-4">Architecture</h3>
              <div className="space-y-2 mb-12">
                {selectedRepo.languages.map(l => (
                  <div key={l.name} className="flex justify-between items-center text-xl font-medium border-b-2 border-black pb-2">
                    <span>{l.name}</span>
                    <span>{l.percentage}%</span>
                  </div>
                ))}
                {selectedRepo.languages.length === 0 && <span className="text-xl italic">Unknown / Mixed</span>}
              </div>
              <a 
                href={selectedRepo.html_url} 
                target="_blank" 
                className="inline-block text-3xl font-black uppercase border-4 border-black px-8 py-4 hover:bg-black hover:text-white transition-colors"
              >
                View Source ↗
              </a>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen p-8 md:p-12 max-w-7xl mx-auto">
          <header className="mb-24 mt-12 border-b-2 border-white pb-12">
            <h1 className="text-5xl md:text-8xl font-black tracking-tighter uppercase">Sebimala.</h1>
            <p className="text-2xl mt-4 opacity-50">Selected Works / Non-Forked Repositories</p>
          </header>

          <div className="space-y-4">
            {repos.map((repo) => (
              <div 
                key={repo.id} 
                onClick={() => setSelectedRepo(repo)}
                className="group border-2 border-white/20 p-6 md:p-10 cursor-pointer hover-invert transition-colors flex flex-col md:flex-row justify-between items-start md:items-center gap-6"
              >
                <div>
                  <h2 className="text-4xl md:text-6xl font-bold tracking-tight group-hover:italic transition-all">
                    {repo.name}
                  </h2>
                  <div className="flex gap-4 mt-4 opacity-70">
                    <span className="font-mono">★ {repo.stargazers_count}</span>
                    <span className="font-mono uppercase">{repo.languages[0]?.name || 'N/A'}</span>
                  </div>
                </div>
                <div className="text-4xl opacity-0 group-hover:opacity-100 transition-opacity">
                  ↗
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
